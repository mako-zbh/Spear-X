# SpearX build configuration
version: '3'

info:
  companyName: "Spe4r Development"
  productName: "SpearX"
  productIdentifier: "com.spe4r.spearx"
  description: "A modern cross-platform tool manager"
  copyright: "© 2025 Spe4r"
  comments: "Modern cross-platform tool manager by Spe4r"
  version: "2.0.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
