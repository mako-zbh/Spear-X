[package]
name = "spearx"
version = "3.0.0"
edition = "2021"
description = "A modern cross-platform tool manager"
authors = ["Spe4r Development"]
license = "MIT"

[lib]
name = "spearx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
shell-words = "1"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.6"
# 用于访问 NSWindow 以压住透明窗口 resize 时的白闪
# 版本与 tao/window-vibrancy 依赖树对齐，避免引入第二份拷贝
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSWindow", "NSView", "NSColor"] }
objc2-foundation = "0.3"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading"] }
# Windows 11 Mica 毛玻璃材质（Win10 自动降级为普通窗口）
window-vibrancy = "0.6"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
