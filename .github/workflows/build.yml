name: build

on:
  workflow_dispatch:
  push:
    branches: [tauri-migration, main]
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          # macOS Intel（同 runner 交叉编译）
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          # Windows x64
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要两个 target 做交叉编译
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # 两个 macOS matrix job 编译不同 --target，用 key 区分缓存避免互相覆盖
          key: ${{ matrix.args }}

      # beforeBuildCommand 是 {script:"npm run build", cwd:"../frontend"}
      # 在 frontend/ 下装好依赖，build 由 tauri-action 触发
      - name: install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: build via tauri-action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 推 v* 开头的 tag 时创建 Release；普通分支推送只构建不上线
          # 注意：__VERSION__ 取自 tauri.conf.json 的 version，发版时 tag 必须与其一致，
          # 否则 Release 会创建在 conf 版本对应的 tag 上（如推 v3.0.1 但 conf 是 3.0.0）
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && 'v__VERSION__' || '' }}
          # 预发布版本（tag 含 - ，如 v3.1.0-1 / v3.1.0-beta.1）名称加 Beta 后缀
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && (contains(github.ref_name, '-') && 'SpearX v__VERSION__ (Beta)' || 'SpearX v__VERSION__') || '' }}
          releaseBody: '见 Assets 下载对应平台的安装包。macOS 首次打开如提示损坏，执行：xattr -rd com.apple.quarantine /Applications/SpearX.app'
          releaseDraft: true
          # 预发布版本自动标记（MSI 不支持非数字预发布标识，约定用 3.1.0-1 这种数字形式）
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: list bundle artifacts
        if: always()
        shell: bash
        run: |
          echo "=== bundle 目录树 ==="
          find src-tauri/target -maxdepth 6 -path "*bundle*" 2>/dev/null || true
          echo "=== 安装包文件 ==="
          find src-tauri/target -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*-setup.exe" \) 2>/dev/null || true
          find src-tauri/target -type d -name "*.app" 2>/dev/null || true


      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SpearX-${{ matrix.platform }}-${{ matrix.args || 'x64' }}
          # glob 的 * 不能跨 /：无 --target 时 bundle 在 target/release/bundle，
          # 有 --target 时在 target/<triple>/release/bundle，两种布局都要显式列出
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/*/release/bundle/**/*.dmg
            src-tauri/target/*/release/bundle/**/*.app
            src-tauri/target/*/release/bundle/**/*.msi
            src-tauri/target/*/release/bundle/**/*-setup.exe
          if-no-files-found: error


