name: build

on:
  workflow_dispatch:
  push:
    branches: [tauri-migration, main]
  pull_request:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          # macOS Intel（同 runner 交叉编译）
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          # Windows x64
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 需要两个 target 做交叉编译
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # beforeBuildCommand 是 {script:"npm run build", cwd:"../frontend"}
      # 在 frontend/ 下装好依赖，build 由 tauri-action 触发
      - name: install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: build via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 不传 tagName/releaseName：只构建，不发 Release
          args: ${{ matrix.args }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpearX-${{ matrix.platform }}-${{ matrix.args || 'x64' }}
          # --target 时路径会多一层 target/<triple>/release/bundle
          path: |
            src-tauri/target*/release/bundle/**/*.dmg
            src-tauri/target*/release/bundle/**/*.app
            src-tauri/target*/release/bundle/**/*.msi
            src-tauri/target*/release/bundle/**/*-setup.exe
          if-no-files-found: error
